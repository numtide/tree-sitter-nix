name: Release

on:
  push:
    tags:
      - "v*.*.*" # Matches tags like v1.0.0, v2.1.3, etc.
  workflow_dispatch:
    inputs:
      tag:
        description: >-
          Existing release tag to dry-run against (e.g. v0.5.0). Checks out
          that tag, builds every asset, and reports whether the tag's GitHub
          release already carries them and whether they match. Nothing is
          uploaded or published. Leave empty to build from the selected ref.
        required: false
        type: string
        default: ""

permissions:
  contents: read

env:
  # Single source of truth for the WASM toolchain. The CLI must be the one
  # that generated src/parser.c (asserted against its @generated header in
  # `verify`) and emsdk must be the version that CLI pins in
  # cli/loader/emscripten-version (asserted in `release-wasm`). CLI >= 0.26
  # ignores emsdk entirely and downloads an unpinned wasi-sdk at build time,
  # so bumping TREE_SITTER_CLI_VERSION past 0.25.x needs a deliberate
  # rewrite of the release-wasm job, not just a number change.
  TREE_SITTER_CLI_VERSION: "0.25.10"
  EMSCRIPTEN_VERSION: "4.0.4" # tree-sitter v0.25.10 pins emscripten 4.0.4
  # The tag whose release this run builds for: the pushed tag, or the
  # dry-run input. Empty on a workflow_dispatch without a tag.
  RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false # never cancel a publish mid-flight

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: write # creates the draft release the upload jobs fill
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.tag }} # empty on push -> the pushed tag

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable (2026-04-19)

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - name: Check tag matches Cargo.toml version
        if: env.RELEASE_TAG != ''
        run: |
          tag="${RELEASE_TAG#v}"
          manifest=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          if [ "$tag" != "$manifest" ]; then
            echo "::error::Tag v$tag does not match Cargo.toml version $manifest"
            exit 1
          fi

      - name: Check parser.c was generated by the pinned tree-sitter CLI
        # The WASM job builds with TREE_SITTER_CLI_VERSION. If someone
        # regenerates parser.c with a newer CLI without bumping the pin,
        # the released .wasm would be built by a CLI that never saw that
        # grammar's ABI. Fail early, before anything is published.
        run: |
          header=$(head -1 src/parser.c)
          expected="/* Automatically @generated by tree-sitter v${TREE_SITTER_CLI_VERSION} */"
          if [ "$header" != "$expected" ]; then
            echo "::error file=src/parser.c,line=1::parser.c header is '$header'; expected '$expected'. Bump TREE_SITTER_CLI_VERSION in publish.yml (and re-check the emsdk pin) or regenerate with v${TREE_SITTER_CLI_VERSION}."
            exit 1
          fi

      - name: Dry-run publish
        run: cargo publish --locked --dry-run

      - name: Package contents
        run: cargo package --locked --list

      # The tag push fires before a human has created the release, and
      # `gh release upload` fails when it does not exist (the asset jobs
      # have never run on a real tag yet: v0.4.0/v0.5.0 predate them).
      # Create a DRAFT with generated notes so nothing goes public
      # without a human, but the assets are never lost. Done here, once:
      # GitHub does not reserve a tag name for drafts, so two jobs doing
      # this concurrently would each create their own draft and the
      # uploads would land in whichever is newest. The upload jobs all
      # `needs: verify`, so the draft exists before they start.
      - name: Ensure the GitHub release exists
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" --json isDraft -q .isDraft >/dev/null 2>&1; then
            echo "release $RELEASE_TAG exists"
          else
            gh release create "$RELEASE_TAG" --draft --verify-tag --generate-notes --title "$RELEASE_TAG"
          fi

  release-crate:
    needs: verify
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      # The org-level secret is named CRATES_IO_TOKEN (visible via
      # /repos/numtide/tree-sitter-nix/actions/organization-secrets).
      # Secrets can't be tested in `if:`, so check the env var instead,
      # before spending minutes on the toolchain: an empty token makes
      # `cargo publish` fail with an unhelpful "please provide a
      # non-empty token" at the very end.
      - name: Preflight crates.io token
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
        run: |
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            echo "::error::Secret CRATES_IO_TOKEN is empty or not granted to this repository. Add it under the numtide org's Actions secrets (or repository secrets) and re-run."
            exit 1
          fi

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable (2026-04-19)

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      # `cargo publish` hard-fails when the version already exists, which
      # makes every re-run of a partially failed release red. Ask crates.io
      # first so the job is idempotent.
      - name: Check whether this version is already on crates.io
        id: cratesio
        run: |
          meta=$(cargo metadata --no-deps --format-version 1)
          name=$(jq -r '.packages[0].name' <<< "$meta")
          version=$(jq -r '.packages[0].version' <<< "$meta")
          status=$(curl -sS -o /dev/null -w '%{http_code}' \
            -A "$GITHUB_REPOSITORY release workflow" \
            "https://crates.io/api/v1/crates/$name/$version")
          case "$status" in
            200)
              echo "::notice::$name $version is already on crates.io; skipping publish"
              echo "published=true" >> "$GITHUB_OUTPUT"
              ;;
            404)
              echo "$name $version not yet on crates.io"
              echo "published=false" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "::error::crates.io returned HTTP $status for $name $version"
              exit 1
              ;;
          esac

      - name: Publish to crates.io
        if: steps.cratesio.outputs.published != 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
        run: cargo publish --locked

  release-wasm:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write # required to create the release / upload assets
      id-token: write # required to sign the attestation via GitHub OIDC
      attestations: write # required to persist the attestation
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.tag }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Set up Emscripten
        uses: mymindstorm/setup-emsdk@4528d102f7230f0e7b276855c01ea1159be0e984 # v16
        with:
          version: ${{ env.EMSCRIPTEN_VERSION }}
          actions-cache-folder: emsdk-cache

      - name: Install tree-sitter CLI
        # Pin to the tree-sitter version that generated the checked-in
        # parser.c (see the @generated header). `verify` already asserted
        # the header matches TREE_SITTER_CLI_VERSION.
        run: npm install --no-save "tree-sitter-cli@${TREE_SITTER_CLI_VERSION}"

      - name: Assert the WASM toolchain is exactly the pinned one
        # Three independent things must agree or the .wasm silently
        # changes: the CLI npm actually installed, the emcc on PATH, and
        # the emsdk version that CLI expects. Without emsdk on PATH,
        # CLI 0.25.x falls back to docker, which fails on hosted runners.
        run: |
          cli=$(node_modules/.bin/tree-sitter --version)
          case "$cli" in
            "tree-sitter ${TREE_SITTER_CLI_VERSION} "*|"tree-sitter ${TREE_SITTER_CLI_VERSION}") ;;
            *)
              echo "::error::Installed CLI is '$cli', expected tree-sitter ${TREE_SITTER_CLI_VERSION}"
              exit 1
              ;;
          esac
          emcc_line=$(emcc --version | head -1)
          case "$emcc_line" in
            *" ${EMSCRIPTEN_VERSION} "*) ;;
            *)
              echo "::error::emcc on PATH is '$emcc_line', expected emscripten ${EMSCRIPTEN_VERSION}"
              exit 1
              ;;
          esac
          # Advisory cross-check against upstream: the value is a constant
          # for a pinned CLI and the emcc check above already enforces it,
          # so a transient raw.githubusercontent.com failure must not
          # abort a release.
          if upstream_pin=$(curl -fsSL "https://raw.githubusercontent.com/tree-sitter/tree-sitter/v${TREE_SITTER_CLI_VERSION}/cli/loader/emscripten-version" | tr -d '[:space:]'); then
            if [ "$upstream_pin" != "$EMSCRIPTEN_VERSION" ]; then
              echo "::error::tree-sitter v${TREE_SITTER_CLI_VERSION} pins emscripten '$upstream_pin' but EMSCRIPTEN_VERSION is '${EMSCRIPTEN_VERSION}'"
              exit 1
            fi
          else
            echo "::warning::could not fetch tree-sitter's emscripten-version pin; relying on the emcc --version check"
          fi
          echo "OK: $cli, $emcc_line"

      - name: Build WASM
        run: node_modules/.bin/tree-sitter build --wasm --output tree-sitter-nix.wasm

      - name: Generate checksum
        # The digest of the .wasm depends on the exact CLI + emscripten
        # pair, so record them in the sidecar. `sha256sum -c` skips `#`
        # comment lines (also with --strict), so the file still verifies.
        run: |
          {
            echo "# tree-sitter-nix.wasm built with tree-sitter-cli ${TREE_SITTER_CLI_VERSION} and emscripten ${EMSCRIPTEN_VERSION}"
            echo "# The digest is only reproducible with that exact toolchain; a different CLI produces a different blob."
            sha256sum tree-sitter-nix.wasm
          } > tree-sitter-nix.wasm.sha256
          cat tree-sitter-nix.wasm.sha256
          {
            echo "### tree-sitter-nix.wasm"
            echo
            echo "- tree-sitter-cli: \`${TREE_SITTER_CLI_VERSION}\`"
            echo "- emscripten: \`${EMSCRIPTEN_VERSION}\`"
            echo "- sha256: \`$(sha256sum tree-sitter-nix.wasm | cut -d' ' -f1)\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Validate WASM module structure
        # WebAssembly.Module() runs the full WASM validation algorithm
        # (section ordering, type checking, function-table consistency),
        # not just the magic header. A truncated or corrupt blob with an
        # intact header would still fail here. It does NOT instantiate
        # or call into the parser — that needs web-tree-sitter, which
        # we don't add as a dev dependency just for this check.
        run: |
          node - <<'JS'
            const fs = require("fs");
            const buf = fs.readFileSync("tree-sitter-nix.wasm");
            const mod = new WebAssembly.Module(buf);
            const exports = WebAssembly.Module.exports(mod).map((e) => e.name);
            if (!exports.some((n) => n.startsWith("tree_sitter_"))) {
              throw new Error(`Missing tree_sitter_* export. Got: ${exports.join(", ")}`);
            }
            console.log(`OK: ${buf.length} bytes, ${exports.length} exports, valid WASM module`);
          JS

      # SLSA build provenance attestation. Cryptographically asserts
      # that this exact WASM blob (by digest) was built by this
      # workflow run, from this commit, on this runner. Verifiable
      # downstream with:
      #
      #   gh attestation verify tree-sitter-nix.wasm --repo numtide/tree-sitter-nix
      #
      # If the asset is ever swapped after publication, the verify
      # fails. Recorded in the public Sigstore transparency log.
      # Only on tag push: attestations are tied to the artifact
      # digest, and workflow_dispatch artifacts are throwaway.
      - name: Generate build provenance attestation
        if: github.event_name == 'push'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: tree-sitter-nix.wasm

      # Always kept as a workflow artifact so `verify-release` can compare
      # what this run built against what the release actually serves.
      - name: Upload workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tree-sitter-nix-wasm
          retention-days: 14
          path: |
            tree-sitter-nix.wasm
            tree-sitter-nix.wasm.sha256

      # The draft release was created by `verify` (see there for why it
      # is a draft and why only one job creates it).
      #
      # Use `gh release upload` rather than softprops/action-gh-release.
      # The latter auto-creates a published release with no body if one
      # doesn't already exist, which would race with the manual release
      # notes. `gh release upload` only ever touches assets.
      #
      # `--clobber` overwrites existing assets — needed for the
      # legitimate "delete the broken release, fix, re-tag, re-publish"
      # workflow. Be aware this also means a force-pushed tag silently
      # replaces the WASM asset. Force-pushing a published tag is bad
      # practice independent of this workflow.
      - name: Upload release assets (tag push)
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$RELEASE_TAG" --clobber \
            tree-sitter-nix.wasm \
            tree-sitter-nix.wasm.sha256

  release-tarball:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write # required to create the release / upload assets
      id-token: write # required to sign the attestation via GitHub OIDC
      attestations: write # required to persist the attestation
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.tag }}

      # Tarball contains every git-tracked file plus the generated
      # parser sources (parser.c, grammar.json, node-types.json,
      # tree_sitter/*.h). We track those in git already, so the
      # explicit append is currently a no-op — but it future-proofs
      # against a change that stops checking generated files in.
      #
      # Why a custom tarball when GitHub auto-generates source
      # archives? GitHub's auto-archives don't have stable hashes —
      # GitHub may re-compress them at any time, breaking pinned
      # `fetchurl` hashes in nixpkgs / Bazel / Buck consumers. This
      # tarball is built once and stays fixed.
      #
      # Reproducibility caveats:
      # - `LC_ALL=C` so `sort` collation order is locale-independent.
      #   Without it, en_US.UTF-8 vs C.UTF-8 produce different file
      #   orders → different SHA256.
      # - `--mode=ugo+rX,u+w` normalizes file modes so the runner's
      #   umask doesn't leak into the archive.
      # - `--mtime` pins entry mtimes to the commit timestamp.
      # - tar's `--sort=name` is dropped: it only affects recursive
      #   directory traversal, not `-T` file lists, so it was a no-op.
      # - tar/gzip versions are NOT pinned (ubuntu-latest stock).
      #   DEFLATE encoding is implementation-defined, so the hash is
      #   only stable across runs on the same image. The strong
      #   guarantee for downstream consumers is "uploaded once, stays
      #   fixed" — the asset itself never changes.
      #
      # File selection mirrors tree-sitter's official `release.yml`
      # reusable workflow.
      - name: Create source tarball
        env:
          LC_ALL: C
        run: |
          git ls-files > "$RUNNER_TEMP/files"
          printf '%s\n' >> "$RUNNER_TEMP/files" \
            src/parser.c src/scanner.c src/grammar.json src/node-types.json \
            src/tree_sitter/parser.h src/tree_sitter/alloc.h src/tree_sitter/array.h
          tar czf tree-sitter-nix.tar.gz \
            --owner=0 --group=0 --numeric-owner \
            --mode='ugo+rX,u+w' \
            --mtime="@$(git log -1 --format=%ct)" \
            -T <(sort -u "$RUNNER_TEMP/files")

      - name: Generate checksum
        run: |
          {
            echo "# tree-sitter-nix.tar.gz: git-tracked sources of $GITHUB_REPOSITORY at $(git rev-parse HEAD)"
            sha256sum tree-sitter-nix.tar.gz
          } > tree-sitter-nix.tar.gz.sha256
          cat tree-sitter-nix.tar.gz.sha256

      - name: Validate tarball contents
        # Sanity-check the tarball has the must-have files for downstream
        # consumers. A misconfigured `git ls-files` (e.g. shallow clone
        # without LFS) would be caught here. `grep -qFx` so dots aren't
        # treated as regex wildcards.
        run: |
          listing=$(tar tzf tree-sitter-nix.tar.gz)
          required=(
            grammar.js
            tree-sitter.json
            LICENSE
            src/parser.c
            src/scanner.c
            src/grammar.json
            src/node-types.json
            src/tree_sitter/parser.h
            src/tree_sitter/alloc.h
            src/tree_sitter/array.h
            queries/highlights.scm
            queries/injections.scm
            queries/locals.scm
            queries/tags.scm
            queries/indents.scm
            queries/folds.scm
            bindings/rust/lib.rs
            bindings/node/index.js
          )
          for f in "${required[@]}"; do
            if ! grep -qFx "$f" <<< "$listing"; then
              echo "::error::Required file missing from tarball: $f"
              exit 1
            fi
          done
          echo "OK: $(wc -l <<< "$listing") files, all ${#required[@]} required entries present"

      # SLSA build provenance attestation. See the equivalent step in
      # `release-wasm` for rationale. Verifiable downstream with:
      #
      #   gh attestation verify tree-sitter-nix.tar.gz --repo numtide/tree-sitter-nix
      - name: Generate build provenance attestation
        if: github.event_name == 'push'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: tree-sitter-nix.tar.gz

      - name: Upload workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tree-sitter-nix-tarball
          retention-days: 14
          path: |
            tree-sitter-nix.tar.gz
            tree-sitter-nix.tar.gz.sha256

      # Into the draft release created by `verify`.
      - name: Upload release assets (tag push)
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$RELEASE_TAG" --clobber \
            tree-sitter-nix.tar.gz \
            tree-sitter-nix.tar.gz.sha256

  # End-to-end check of what a consumer will actually see. On tag push
  # every problem is fatal; on a workflow_dispatch dry-run against an
  # existing tag the same checks only warn, so an old release with no
  # assets (v0.4.0, v0.5.0) still reports instead of failing the build
  # path we are exercising.
  verify-release:
    needs: [release-crate, release-wasm, release-tarball]
    # release-crate is skipped on dispatch; still run when the others passed.
    if: >-
      always()
      && needs.release-wasm.result == 'success'
      && needs.release-tarball.result == 'success'
      && (needs.release-crate.result == 'success' || needs.release-crate.result == 'skipped')
      && (github.event_name == 'push' || inputs.tag != '')
    runs-on: ubuntu-latest
    permissions:
      # Draft releases are invisible to a read-only token, and the release
      # created above is a draft until a human publishes it.
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.tag }}

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: built
          merge-multiple: true

      - name: Verify release assets, checksums, and attestations
        env:
          GH_TOKEN: ${{ github.token }}
          STRICT: ${{ github.event_name == 'push' }}
        run: |
          failures=0
          problem() {
            if [ "$STRICT" = "true" ]; then echo "::error::$*"; failures=$((failures + 1))
            else echo "::warning::$*"; fi
          }
          expected="tree-sitter-nix.wasm tree-sitter-nix.wasm.sha256 tree-sitter-nix.tar.gz tree-sitter-nix.tar.gz.sha256"

          if ! assets=$(gh release view "$RELEASE_TAG" --json assets -q '.assets[].name'); then
            problem "No GitHub release found for $RELEASE_TAG"
            assets=""
          fi
          echo "Release $RELEASE_TAG assets: ${assets:-(none)}"

          missing=0
          for a in $expected; do
            if ! grep -qFx "$a" <<< "$assets"; then problem "Release $RELEASE_TAG is missing asset $a"; missing=1; fi
          done

          if [ "$missing" = 0 ]; then
            mkdir -p released
            gh release download "$RELEASE_TAG" --dir released --pattern 'tree-sitter-nix.*'
            # 1. Each released asset matches its released sidecar.
            (cd released && sha256sum -c --strict tree-sitter-nix.wasm.sha256 tree-sitter-nix.tar.gz.sha256) \
              || problem "Released assets do not match their .sha256 sidecars"
            # 2. The released .wasm is byte-identical to the one this run
            #    built. Same CLI + emsdk => same blob, so a difference means
            #    the toolchain drifted or the asset was replaced.
            if ! cmp -s released/tree-sitter-nix.wasm built/tree-sitter-nix.wasm; then
              problem "Released tree-sitter-nix.wasm differs from the one built in this run ($(sha256sum released/tree-sitter-nix.wasm | cut -c1-16)... vs $(sha256sum built/tree-sitter-nix.wasm | cut -c1-16)...)"
            fi
            # The tarball's gzip stream is only stable per runner image, so
            # only report, never fail, on a mismatch.
            if ! cmp -s released/tree-sitter-nix.tar.gz built/tree-sitter-nix.tar.gz; then
              echo "::notice::Released tree-sitter-nix.tar.gz differs byte-wise from this run's build (expected across runner images; content is still checked by sha256sum -c above)"
            fi
            # 3. SLSA provenance resolves for both assets (only tag-push
            #    runs attest; on a dry-run the released assets came from
            #    an earlier tag-push run and must still verify).
            for f in tree-sitter-nix.wasm tree-sitter-nix.tar.gz; do
              gh attestation verify "released/$f" --repo "$GITHUB_REPOSITORY" \
                || problem "gh attestation verify failed for $f"
            done
            # 4. The sidecar records which CLI produced the blob (R2-034).
            grep -q "tree-sitter-cli ${TREE_SITTER_CLI_VERSION}" released/tree-sitter-nix.wasm.sha256 \
              || problem "tree-sitter-nix.wasm.sha256 does not record tree-sitter-cli ${TREE_SITTER_CLI_VERSION}"
          fi

          {
            echo "### Release $RELEASE_TAG"
            echo
            echo "| asset | on release |"
            echo "| --- | --- |"
            for a in $expected; do
              if grep -qFx "$a" <<< "$assets"; then echo "| $a | yes |"; else echo "| $a | **missing** |"; fi
            done
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$failures" -gt 0 ]; then
            echo "::error::$failures release check(s) failed for $RELEASE_TAG"
            exit 1
          fi

      - name: Verify the crate is on crates.io
        if: github.event_name == 'push'
        run: |
          meta=$(cargo metadata --no-deps --format-version 1)
          name=$(jq -r '.packages[0].name' <<< "$meta")
          version=$(jq -r '.packages[0].version' <<< "$meta")
          # The API is usually consistent immediately after publish, but
          # give it a few tries before declaring the release broken.
          for attempt in 1 2 3 4 5; do
            status=$(curl -sS -o /dev/null -w '%{http_code}' \
              -A "$GITHUB_REPOSITORY release workflow" \
              "https://crates.io/api/v1/crates/$name/$version")
            if [ "$status" = 200 ]; then
              echo "OK: $name $version is on crates.io"
              exit 0
            fi
            echo "attempt $attempt: crates.io returned HTTP $status for $name $version"
            sleep 15
          done
          echo "::error::$name $version is not on crates.io after publish"
          exit 1
