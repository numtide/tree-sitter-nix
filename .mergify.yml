pull_request_rules:
  - name: automatic merge for Renovate pull requests
    conditions:
      - author=renovate[bot]
      # TODO(buildbot-migration): confirm the exact status-check name that
      # buildbot.numtide.com posts back to the PR (typically something like
      # "buildbot/nix-eval" or "buildbot.numtide.com/<project>"). Replace
      # once verified from a real PR against buildbot.
      - check-success=buildbot/nix-eval
    actions:
      merge:
        method: rebase
